<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno - Interclasse Arena</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="pagina-login">
  <div class="container">
    <div class="card card-login">
      <img class="logo-interclasse marca-login" src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo do Interclasse">
      <h2>Criar conta de aluno</h2>
      <p style="color: var(--texto-secundario); font-size: 0.9rem; margin-top: -8px;">
        Use seu e-mail escolar (nome.aluno@escola.pr.gov.br) para criar sua conta.
      </p>

      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Seu nome completo">

      <label for="email">E-mail escolar</label>
      <input type="email" id="email" placeholder="nome.aluno@escola.pr.gov.br">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Crie uma senha">

      <label for="confirmar-senha">Confirmar senha</label>
      <input type="password" id="confirmar-senha" placeholder="Repita a senha">

      <button class="btn-primaria" id="btn-cadastrar">Criar conta</button>
      <div class="erro" id="msg-erro"></div>

      <p style="text-align:center; margin-top:16px;">
        <a href="{{ url_for('pagina_login') }}">Já tem conta? Entrar →</a>
      </p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
  <script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>
</body>
</html>
